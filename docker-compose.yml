services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=a2bf9c79
      - POSTGRES_DB=internship-project
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # This overrides the local localhost string to point to the 'db' service
      - DATABASE_URL=postgresql://postgres:a2bf9c79@db:5432/internship-project
    depends_on:
      - db

volumes:
  postgres_data:
