<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
</head>
<body>
    <h1>Weather</h1>
    <p style="font-size: large;">Enter the name of the city</p>

    <input id="city" placeholder="Enter city">
    <button onclick="getWeather()">Search</button>

    <p  id="result"></p>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value;
            const response = await fetch(`http://127.0.0.1:8000/weather/${city}`);
            if (response.ok) {
                return
            }
            const data = await response.json();
            document.getElementById("result").innerText = `It is ${data.temperature}°C in ${data.city}. Feels like ${data.feeling}°C. The sky is ${data.clouds} today.`;
        }
    </script>

</body>
</html>
