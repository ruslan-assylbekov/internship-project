[project]
name = "internship-project"
version = "0.1.0"
description = "FastAPI library service: users, books, and weather lookup"
readme = "README.md"
requires-python = ">=3.14"
# Direct dependencies only. The previous list was a `pip freeze` dump, which
# pinned transitive packages (anyio, h11, idna, ...) as if they were direct and
# made routine upgrades conflict. uv.lock pins the full transitive graph.
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.10.1",          # access tokens for /auth/login
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",  # OAuth2PasswordRequestForm on /auth/token
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",  # required by fastapi.testclient.TestClient
    "pytest>=8.3.3",
    "ruff>=0.9.0",
]

[tool.ruff]
# Matches requires-python; without this ruff infers the target from the
# environment and its `UP` fixes would be pinned to whatever ran it.
target-version = "py314"
# 100 rather than the default 88: the existing code already wraps around 100,
# and the narrower limit would flag lines nobody intends to rewrap.
line-length = 100

[tool.ruff.lint]
# E/F/W are pycodestyle+pyflakes, I sorts imports, UP catches syntax kept for
# older Pythons, B is bugbear, C4 comprehensions, SIM simplifications.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares dependencies and query parameters -- 41 of 57 initial diagnostics
# were this one rule objecting to the framework's own idiom. Listed here rather
# than ignoring B008 outright so it still catches a real mutable default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are left exactly as Alembic's template writes them, header
# comments, `Union[...]` annotations and unsorted imports included, so a
# revision stays diffable against a freshly generated one.
"alembic/versions/**" = ["E501", "I001", "UP", "W291"]
# Columns and fields are deliberately aligned into readable blocks
# (`title:  str`, `default = 0`), which E221/E251 exist to forbid.
"src/models/database_models.py" = ["E221", "E251"]
"src/schemas/**" = ["E221", "E251"]

[tool.ruff.format]
# The project quotes with double quotes everywhere except the older model and
# migration files; this is the default, stated so it does not silently change.
quote-style = "double"
# Excluded from formatting, not from linting: these files align columns and
# fields into readable blocks (`title:  str`, `default = 0`), which is also why
# E221/E251 are ignored for them above. The formatter would flatten that
# alignment, so both the pre-commit hook and CI have to leave them alone.
exclude = [
    "alembic/versions/**",
    "src/models/database_models.py",
    "src/schemas/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette's TestClient still imports httpx; nothing to act on until
    # FastAPI switches to httpx2 upstream.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
